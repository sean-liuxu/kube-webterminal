---
# ============================================================
# K8s Pod WebTerminal — Complete Deployment Manifest
# ============================================================
# Usage: kubectl apply -f deploy.yaml
# This deploys the webterminal gateway with NodePort exposure,
# no Ingress required. All resources live in the `default` namespace.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webterminal-gateway
  namespace: default
  labels:
    app: webterminal-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webterminal-gateway
  template:
    metadata:
      labels:
        app: webterminal-gateway
    spec:
      serviceAccountName: webterminal-gateway
      containers:
        - name: gateway
          image: your-registry/webterminal-gateway:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GIN_MODE
              value: "release"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: webterminal-gateway
  namespace: default
  labels:
    app: webterminal-gateway
spec:
  type: NodePort
  selector:
    app: webterminal-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
