---
# ============================================================
# K8s Pod WebTerminal — Minimal RBAC Configuration
# ============================================================
# This config grants the webterminal service account the minimum
# permissions required to exec into pods across all namespaces.
# For multi-tenant environments, use ClusterRole with namespace-scoped
# RoleBindings, or tighten to specific namespaces.
# All resources are deployed into the `default` namespace.

---
# ServiceAccount for the webterminal gateway pod itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webterminal-gateway
  namespace: default
  labels:
    app: webterminal-gateway

---
# ClusterRole: minimum permissions for pod exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webterminal-exec
  labels:
    app: webterminal-gateway
rules:
  # Core permission: exec into pods.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]

  # Needed to list pods (optional, for UI autocomplete).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Needed to read pod status (optional, container existence check).
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]

  # Needed for namespace listing (optional, for namespace dropdown).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding: bind the ClusterRole to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webterminal-exec-binding
  labels:
    app: webterminal-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webterminal-exec
subjects:
  - kind: ServiceAccount
    name: webterminal-gateway
    namespace: default

---
# ============================================================
# Impersonate permission for the gateway ServiceAccount.
# The frontend sends user_id (e.g. 'web-user') in the init message,
# and the gateway impersonates that user. Without this rule the
# gateway gets "cannot impersonate" errors.
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webterminal-impersonate
  labels:
    app: webterminal-gateway
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webterminal-impersonate-binding
  labels:
    app: webterminal-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webterminal-impersonate
subjects:
  - kind: ServiceAccount
    name: webterminal-gateway
    namespace: default

---
# ============================================================
# Permissions for impersonated end users (e.g. 'web-user').
# The 403 "User web-user cannot get resource pods" comes from this
# missing binding: impersonation succeeds but the user has no rights.
# Bind the same exec permissions to the end user.
# NOTE: user_id comes from the frontend and is freely forgeable —
# only acceptable behind an authenticating reverse proxy.
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webterminal-user
  labels:
    app: webterminal-gateway
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webterminal-user-binding
  labels:
    app: webterminal-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webterminal-user
subjects:
  - kind: User
    name: web-user          # must match the user_id sent by the frontend
    apiGroup: rbac.authorization.k8s.io

---
# Optional: namespace-scoped variant (grant 'web-user' only in one
# namespace, e.g. default). Use INSTEAD of the ClusterRoleBinding above.
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: webterminal-user-binding
#   namespace: default
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: webterminal-user
# subjects:
#   - kind: User
#     name: web-user
#     apiGroup: rbac.authorization.k8s.io

---
# Optional: Namespace-scoped variant (if you only need one namespace).
# Replace ClusterRole/ClusterRoleBinding above with these if you want
# to restrict the gateway to a single namespace.
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: webterminal-exec
#   namespace: <target-namespace>
# rules:
#   - apiGroups: [""]
#     resources: ["pods/exec"]
#     verbs: ["create", "get"]
#   - apiGroups: [""]
#     resources: ["pods"]
#     verbs: ["get", "list"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: webterminal-exec-binding
#   namespace: <target-namespace>
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: Role
#   name: webterminal-exec
# subjects:
#   - kind: ServiceAccount
#     name: webterminal-gateway
#     namespace: default
